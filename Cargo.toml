[package]
name = "scico_rs"
version = "0.2.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
num-complex = "0.4.6"
rayon = "1.12.0"
matrixmultiply = "0.3.11"
libloading = "0.9.0"
# GPU acceleration: real wgpu compute-shader backend behind the `gpu` feature.
# Only pulls in wgpu (+ its WGSL front-end) when the feature is enabled, so the
# default pure-CPU build stays dependency-light.
wgpu-naga-bridge = { version = "30.0.1", optional = true }
naga = { version = "30.0.0", optional = true, features = ["wgsl-in"] }
wgpu = { version = "30.0.1", optional = true, default-features = false, features = [
    "std",
    "parking_lot",
    "metal",
    "vulkan",
    "dx12",
    "gles",
    "wgsl",
] }
pollster = { version = "1.0.1", optional = true }

[features]
# GPU compute backend implemented on wgpu 30.0.1.
gpu = ["wgpu", "pollster"]
wgsl-validate = ["gpu", "wgpu/wgsl", "dep:wgpu-naga-bridge", "dep:naga"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
