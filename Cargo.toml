[package]
name = "scico_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.3+spec-1.1.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
num-complex = "0.4"
rayon = "1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
