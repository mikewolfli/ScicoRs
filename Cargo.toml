[package]
name = "scico_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
num-complex = "0.4.6"
rayon = "1.12.0"
matrixmultiply = "0.3.11"
libloading = "0.9.0"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
